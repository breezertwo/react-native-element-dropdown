pre-commit:
  # Sequential, so linting and type checking see the formatted files.
  parallel: false
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}'
      run: ./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,jsx,ts,tsx}'
      run: ./node_modules/.bin/oxlint {staged_files}
    types:
      glob: '*.{js,jsx,ts,tsx}'
      run: ./node_modules/.bin/tsc --noEmit
commit-msg:
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}
