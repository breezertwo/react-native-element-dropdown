pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: ./node_modules/.bin/eslint {staged_files}
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: ./node_modules/.bin/tsc --noEmit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: ./node_modules/.bin/commitlint --edit {1}
